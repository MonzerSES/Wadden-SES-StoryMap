<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Habitat and Nature Points – slider</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.js"></script>
    <link href="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css" rel="stylesheet">
    <script src="./layers.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #comparison-container { position: absolute; top: 0; bottom: 0; width: 100%; }
        .map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .tag { position: absolute; top: 12px; z-index: 5; background: #fff; border-radius: 6px; padding: 8px 12px; font-weight: 700; font-size: 14px;
               box-shadow: 0 2px 10px rgba(0,0,0,.25); }
        #tag-left { left: 12px; } #tag-right { right: 54px; }
        #back { position: absolute; bottom: 30px; left: 12px; z-index: 5; background: #fff; border-radius: 6px; padding: 8px 12px; font-size: 13px;
                box-shadow: 0 2px 10px rgba(0,0,0,.25); color: #0071bc; text-decoration: none; }
        #legend-left, #legend-right { position: absolute; bottom: 30px; z-index: 5; background: #fff; border-radius: 6px; padding: 10px 12px; width: 240px;
               max-height: 50vh; overflow: auto; font-size: 12px; line-height: 1.35; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
        #legend-left { left: 12px; bottom: 76px; } #legend-right { right: 12px; }
        .row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
        .sw { flex: 0 0 20px; height: 11px; border-radius: 2px; }
        .ramp { height: 12px; margin-top: 8px; border-radius: 2px; }
        .ramp-ticks { display: flex; justify-content: space-between; color: #555; margin-top: 3px; }
        #legend { display: none; }
        @media (max-width: 750px) { #legend-left, #legend-right { display: none; } #tag-right { right: 12px; } }
    </style>
</head>
<body>
    <div id="comparison-container">
        <div id="before" class="map"></div>
        <div id="after" class="map"></div>
    </div>
    <div class="tag" id="tag-left">&larr; Habitat</div>
    <div class="tag" id="tag-right">Nature Points &rarr;</div>
    <div id="legend-left"></div>
    <div id="legend-right"></div>
    <a id="back" href="./index.html">&larr; Back to the story</a>
    <script>
        var style = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';
        var view = { center: [7.1, 54.0], zoom: 6.4 };
        if (window.innerWidth < 750) view.zoom = 5.3;
        var before = new maplibregl.Map(Object.assign({ container: 'before', style: style }, view));
        var after = new maplibregl.Map(Object.assign({ container: 'after', style: style }, view));
        after.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

        function addImage(map, id) {
            map.on('load', function () {
                var labels = map.getStyle().layers.find(function (l) { return l.type === 'symbol'; });
                map.addSource(id, { type: 'image', url: './data/' + id + '.png', coordinates: CORNERS[id] });
                map.addLayer({ id: id + '-layer', type: 'raster', source: id,
                    paint: { 'raster-opacity': 0.95, 'raster-resampling': 'nearest' } }, labels ? labels.id : undefined);
            });
        }
        addImage(before, 'habitat');
        addImage(after, 'np');
        document.getElementById('legend-left').innerHTML = LEGENDS.habitat;
        document.getElementById('legend-right').innerHTML = LEGENDS.np;

        new maplibregl.Compare(before, after, '#comparison-container', {});
    </script>
</body>
</html>
